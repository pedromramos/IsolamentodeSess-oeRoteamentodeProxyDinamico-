<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerenciador de Sessões com Proxy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-7xl mx-auto p-4 space-y-6">
    <header class="flex items-center justify-between">
      <h1 class="text-2xl font-bold">Isolamento de Sessão — Proxy por Sessão</h1>
      <div class="flex gap-2">
        <button id="btnReloadAll" class="px-3 py-2 bg-indigo-600 text-white rounded">Reload</button>
        <button id="btnPlayAll" class="px-3 py-2 bg-green-600 text-white rounded">Play</button>
        <button id="btnPauseAll" class="px-3 py-2 bg-yellow-600 text-white rounded">Pause</button>
        <button id="btnMuteAll" class="px-3 py-2 bg-slate-700 text-white rounded">Mute</button>
        <button id="btnUnmuteAll" class="px-3 py-2 bg-slate-500 text-white rounded">Unmute</button>
      </div>
    </header>

    <section class="bg-white p-4 rounded shadow space-y-4">
      <h2 class="font-semibold">Iniciar Sessões</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium">Lista de proxies (um por linha)</label>
          <textarea id="txtProxies" class="w-full mt-1 p-2 border rounded min-h-[140px]" placeholder="socks5://user:pass@host:port\nhttp://host:port"></textarea>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-sm font-medium">URL</label>
            <input id="txtUrl" class="w-full mt-1 p-2 border rounded" placeholder="https://www.youtube.com/" />
          </div>
          <div>
            <label class="block text-sm font-medium">Nº de sessões</label>
            <input id="txtCount" type="number" min="1" value="1" class="w-full mt-1 p-2 border rounded" />
          </div>
          <button id="btnStart" class="w-full py-2 bg-blue-600 text-white rounded">Iniciar</button>
        </div>
      </div>
    </section>

    <section class="space-y-3">
      <h2 class="font-semibold">Sessões Ativas</h2>
      <div id="sessionsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
